<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <label for="NamaLengkap">Nama Lengkap</label>
    <input type="text" name="nama" placeholder="Nama Lengkap">
    <label for="JenisKelamin">Jenis Kelamin</label>
    <select name="jenis_kelamin">
        <option value="XII RPL 1">XII RPL 1</option>
        <option value="XII RPL 2">XII RPL 2</option>
        <option value="XII RPL 3">XII RPL 3</option>
    </select>
    <label for="Laki-laki">Laki-laki</label>
    <input type="radio" name="jenis_kelamin" value="Laki-laki">
    <label for="Perempuan">Perempuan</label>
    <input type="radio" name="jenis_kelamin" value="Perempuan">
    <label for="Ektrakulikuler">Ektrakulikuler</label>
    <select name="ekstrakulikuler">
        <option value="Web Programming">Web Programming</option>
        <option value="Desain Grafis">Desain Grafis</option>
        <option value="Robotika">Robotika</option>
        <option value="Futsal">Futsal</option>
    </select>
    <label for="nomorTelepon">Nomor Telepon</label>
    <input type="tel" name="nomorTelepon" placeholder="Nomor Telepon">
    <label for="alasan">alasan mengikuti ekstrakulikuler</label>
    <textarea name="alasan" placeholder="Alasan mengikuti ekstrakulikuler"></textarea>
    <button type="submit">Submit</button>
    <button type="reset">Reset</button>
</body>
</html>
